<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Sentirse Bien</title>
    <link rel="icon" type="image/png" href="images/Logo negro.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<div id="toast-error" class="toast-error"></div>

<body class="flex-container">
    <nav class="navbar">
        <img src="images/Logo blanco.png" alt="Logo del spa">
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="turnos.html">Turnos</a>
            <a href="index.html#contacto">Contacto</a>
            <a href="login.html" id="nav-login-link">Iniciar Sesión</a>
            <a href="admin.html" id="nav-admin-link" style="display:none;">Panel Admin</a>
            <a href="perfil-cliente.html" id="nav-client-link" style="display:none;">Mi Cuenta</a>
            <a href="perfil-empleado.html" id="nav-employee-profile" style="display:none;">Mi Cuenta</a>
            <button id="logout-button" style="display:none;">Cerrar Sesión</button>
        </div>
    </nav>

    <script>
    // Script único para manejar la navbar y sesión
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const navLoginLink = document.getElementById('nav-login-link');
        const navAdminLink = document.getElementById('nav-admin-link');
        const navClientLink = document.getElementById('nav-client-link');
        const navEmployeeProfile = document.getElementById('nav-employee-profile');
        const logoutButton = document.getElementById('logout-button');

        if (token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                
                navLoginLink.style.display = 'none';
                if (logoutButton) logoutButton.style.display = 'block';
                
                switch(payload.role) {
                    case 'admin':
                        if (navAdminLink) navAdminLink.style.display = 'block';
                        break;
                    case 'empleado':
                        if (navEmployeeProfile) navEmployeeProfile.style.display = 'block';
                        break;
                    case 'cliente':
                        if (navClientLink) navClientLink.style.display = 'block';
                        break;
                }
            } catch (error) {
                console.error('Error al verificar token:', error);
                localStorage.removeItem('token');
            }
        }

        // Manejar cierre de sesión
        if (logoutButton) {
            logoutButton.addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = 'index.html';
            });
        }
    });
    </script>

    <main class="profile-container">
        <div class="profile-header">
            <h1 class="profile-title">Registro de Cliente</h1>
        </div>
        <div class="profile-content">
            <form id="register-form" class="styled-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" required placeholder="Ingresa tu apellido">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="Ingresa tu correo">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ingresa tu teléfono">
                </div>
                <div class="form-group">
                    <label for="contraseña">Contraseña:</label>
                    <input type="password" id="contraseña" name="contraseña" required placeholder="Crea una contraseña (mínimo 6 caracteres)">
                </div>
                <div class="form-group">
                    <label for="confirmar-contraseña">Confirmar Contraseña:</label>
                    <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" required placeholder="Repite tu contraseña">
                </div>
                <button type="submit" class="form-button">Registrarse</button>
            </form>
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <img src="images/Logo blanco.png" alt="Logo del spa">
            <p>© 2025 Sentirse Bien. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="register.js"></script>
</body>
</html>
