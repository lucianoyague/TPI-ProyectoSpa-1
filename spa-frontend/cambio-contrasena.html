<!DOCTYPE html>
<html>
<head>
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <img src="images/Logo blanco.png" alt="Logo del spa">
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="turnos.html">Turnos</a>
            <a href="index.html#contacto">Contacto</a>
            <a href="login.html" id="nav-login-link">Iniciar Sesión</a>
            <a href="admin.html" id="nav-admin-link" style="display:none;">Panel Admin</a>
            <a href="perfil-cliente.html" id="nav-client-link" style="display:none;">Mi Cuenta</a>
            <a href="perfil-empleado.html" id="nav-employee-profile" style="display:none;">Mi Cuenta</a>
            <button id="logout-button" style="display:none;">Cerrar Sesión</button>
        </div>
    </nav>

    <script>
    // Script único para manejar la navbar y sesión
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const navLoginLink = document.getElementById('nav-login-link');
        const navAdminLink = document.getElementById('nav-admin-link');
        const navClientLink = document.getElementById('nav-client-link');
        const navEmployeeProfile = document.getElementById('nav-employee-profile');
        const logoutButton = document.getElementById('logout-button');

        if (token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                
                navLoginLink.style.display = 'none';
                if (logoutButton) logoutButton.style.display = 'block';
                
                switch(payload.role) {
                    case 'admin':
                        if (navAdminLink) navAdminLink.style.display = 'block';
                        break;
                    case 'empleado':
                        if (navEmployeeProfile) navEmployeeProfile.style.display = 'block';
                        break;
                    case 'cliente':
                        if (navClientLink) navClientLink.style.display = 'block';
                        break;
                }
            } catch (error) {
                console.error('Error al verificar token:', error);
                localStorage.removeItem('token');
            }
        }

        // Manejar cierre de sesión
        if (logoutButton) {
            logoutButton.addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = 'index.html';
            });
        }
    });
    </script>

    <div class="password-change-container">
        <h2>Debes cambiar tu contraseña temporal</h2>
        <form id="change-password-form">
            <input type="password" id="new-password" placeholder="Nueva contraseña" required>
            <input type="password" id="confirm-password" placeholder="Confirmar contraseña" required>
            <button type="submit">Cambiar contraseña</button>
        </form>
    </div>
    <script src="cambio-contrasena.js"></script>
</body>
</html>
